name: Agent4 saturation proof and reciprocal audits

on:
  push:
    paths:
      - '.github/workflows/agent4-saturation-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated Agent4 sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: proofs/agent4
          fetch-depth: 1
      - name: Install the exact official Lean compiler
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Generate and kernel-check the complete strictness certificate
        shell: bash
        run: |
          set -euo pipefail
          cd proofs/agent4/prefix_growth
          mkdir -p logs
          python generate_certificate.py > logs/generator.log
          echo '28e3ebccd4ee9d374d206db85ba27012b1e99ba99fd031379f15029153881bb3  generate_certificate.py' | sha256sum -c -
          echo '8ea1199dbd413869efd8e48955119361cb44c6d7cc69722d276cb1c825da37b0  PrefixModel.lean' | sha256sum -c -
          echo '7ce611b42425dcad50527788d95b9bfa648883ed11561df3ebbb6438a1728791  SaturationCertificate.lean' | sha256sum -c -
          echo '9a7f65a82d611bf24f2661de0715d0a70f69da0b5a51d3ad00725cde37f5b2eb  SaturationTheorem.lean' | sha256sum -c -
          python verify_lean.py --lean "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --output logs \
            PrefixModel.lean SaturationCertificate.lean SaturationTheorem.lean
      - name: Publish only the checked Agent4 certificate and audit records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proofs/agent4/prefix_growth/PrefixModel.lean \
            proofs/agent4/prefix_growth/SaturationCertificate.lean \
            proofs/agent4/prefix_growth/saturation-summary.json \
            proofs/agent4/prefix_growth/logs/
          if ! git diff --cached --quiet; then
            git commit -m 'proofs(agent4): publish kernel-verified saturation certificate and all theorem audits'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Download pinned reciprocal-review sources without modifying their originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review_inputs review_logs
          curl --fail --location --retry 3 -o review_inputs/ExteriorClock.lean \
            https://raw.githubusercontent.com/taco-jpg/p196-algorithm/db65db3646694d95fe6a8e7a0f836d66d8e6a4c8/proofs/agent5/ExteriorClock.lean
          curl --fail --location --retry 3 -o review_inputs/PeriodObstructions.lean \
            https://raw.githubusercontent.com/taco-jpg/p196-algorithm/8902b2b8d5cf495d7ee407e905817e1737aae770/proofs/contributions/2026-10-15-agent8-complementary-bulk/PeriodObstructions.lean
          curl --fail --location --retry 3 -o review_inputs/ExteriorErasure.lean \
            https://raw.githubusercontent.com/taco-jpg/p196-algorithm/9a8c30c0e097f3ef0cfc5c614be957f153e4b827/proofs/contributions/2026-10-15-agent9-complementary-bulk/ExteriorErasure.lean
          curl --fail --location --retry 3 -o review_inputs/LychrelDigitSums.lean \
            https://raw.githubusercontent.com/taco-jpg/p196-algorithm/c2cfb0acfdbf93c12172ebbfa2668ac9976a93bd/proofs/research/continuation/LychrelDigitSums.lean
          echo '83102a949036799a929ba72d74ce9d76bc2a11cb3adf61e0bc06b6013b22991a  review_inputs/PeriodObstructions.lean' | sha256sum -c -
          echo '1de006bcb67eefc0feba31332ed7790813b291aa31de2c8f45de70caf6a970a2  review_inputs/ExteriorErasure.lean' | sha256sum -c -
          sha256sum review_inputs/*.lean > review_logs/source-hashes.log
      - name: Independently compile and audit the three collaborator modules
        shell: bash
        run: |
          set -euo pipefail
          python proofs/agent4/prefix_growth/verify_lean.py \
            --lean "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --output review_logs \
            review_inputs/ExteriorClock.lean review_inputs/PeriodObstructions.lean review_inputs/ExteriorErasure.lean
      - name: Retain exact checked sources and reciprocal-review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent4-saturation-and-review-snapshot
          path: |
            proofs/agent4/prefix_growth/*.lean
            proofs/agent4/prefix_growth/*.py
            proofs/agent4/prefix_growth/*.json
            proofs/agent4/prefix_growth/logs/
            review_inputs/*.lean
            review_logs/
          retention-days: 7
          if-no-files-found: error
