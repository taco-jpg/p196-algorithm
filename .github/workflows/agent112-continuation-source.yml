name: Agent112 continuation source and checker
on:
  push:
    branches: ['research/agent-112/s20261015T2111Z']
    paths: ['.github/workflows/agent112-continuation-source.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Archive selected source and complete current coordination records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent112-acquire
          git rev-parse HEAD > /tmp/agent112-acquire/SOURCE_COMMIT
          git fetch --depth=1 origin p196/coordination
          git rev-parse FETCH_HEAD > /tmp/agent112-acquire/COORDINATION_COMMIT
          git archive FETCH_HEAD proofs/coordination | gzip -1 > /tmp/agent112-acquire/coordination.tar.gz
          python3 - <<'PY'
          import subprocess, tarfile, pathlib, hashlib, json
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          records=[]
          with tarfile.open('/tmp/agent112-acquire/source.tar.gz','w:gz',compresslevel=6) as t:
              for p in paths:
                  if not p: continue
                  x=pathlib.Path(p)
                  include=(x.suffix=='.lean' or (x.suffix in ('.md','.json','.py','.sh','.txt','.toml','.tsv','.csv') and x.stat().st_size<2000000))
                  if not include: continue
                  data=x.read_bytes()
                  records.append({'path':p,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
                  t.add(p,arcname=p,recursive=False)
          pathlib.Path('/tmp/agent112-acquire/SELECTION.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Obtain official pinned Lean checking runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean-official.tar.zst
          sha256sum /tmp/lean-official.tar.zst > /tmp/agent112-acquire/official-archive.sha256
          tar --zstd -xf /tmp/lean-official.tar.zst -C /tmp
          cd /tmp/lean-4.19.0-linux
          find . -type f \( -name '*.a' -o -name '*.c' -o -name '*.ilean' \) -delete
          rm -rf src include share
          ./bin/lean --version > /tmp/agent112-acquire/version.txt
          tar --zstd -cf /tmp/agent112-acquire/checker.tar.zst -C /tmp lean-4.19.0-linux
          cd /tmp/agent112-acquire
          sha256sum *.gz *.zst > SHA256SUMS
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: agent112-continuation-sources
          path: |
            /tmp/agent112-acquire/*.gz
            /tmp/agent112-acquire/*.json
            /tmp/agent112-acquire/*COMMIT
            /tmp/agent112-acquire/SHA256SUMS
            /tmp/agent112-acquire/*.sha256
            /tmp/agent112-acquire/version.txt
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: agent112-continuation-checker
          path: /tmp/agent112-acquire/checker.tar.zst
          compression-level: 0
          retention-days: 2
