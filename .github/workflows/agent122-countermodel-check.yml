name: Agent 122 countermodel kernel check
on:
  push:
    branches: [research/agent-122/s20261015T154828Z]
    paths:
      - .github/workflows/agent122-countermodel-check.yml
      - proofs/contributions/agent-122/finite-seed-countermodel/**
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact official Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/lean-4.19.0-linux.tar.zst https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          printf '%s  %s\n' '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe' '/tmp/lean-4.19.0-linux.tar.zst' | sha256sum --check
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          /tmp/lean-4.19.0-linux/bin/lean --version
      - name: Fresh source rebuild and full exported axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 proofs/contributions/agent-122/finite-seed-countermodel/reproduce.py --lean /tmp/lean-4.19.0-linux/bin/lean --output /tmp/agent122-ci-check
      - name: Verify published evidence and source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path('proofs/contributions/agent-122/finite-seed-countermodel')
          manifest = json.loads((root/'VERIFICATION.json').read_text())
          current = json.loads(pathlib.Path('/tmp/agent122-ci-check/verification.json').read_text())
          assert current['status'] == 'PASS'
          assert current['source_sha256'] == manifest['source_sha256'], 'Published source differs from verified source fingerprints'
          archive = (root/'evidence.json.xz').read_bytes()
          assert hashlib.sha256(archive).hexdigest() == manifest['evidence_sha256']
          evidence = json.loads(lzma.decompress(archive))
          for name, item in evidence['files'].items():
              assert hashlib.sha256(item['utf8'].encode()).hexdigest() == item['sha256'], name
          summary = {
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'candidate_status': 'LEAN-CHECKED',
              'fresh_remote_rebuild': 'PASS',
              'exported_theorems': len(current['theorem_axioms']),
              'axiom_union': current['axiom_union'],
              'retained_evidence_entries': len(evidence['files']),
              'independent_mathematical_review': False,
              'main_integrated': False
          }
          pathlib.Path('/tmp/agent122-ci-check/ci-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Archive logs and source manifest without compiled binaries
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/agent122-ci-evidence
          if [ -d /tmp/agent122-ci-check ]; then
            find /tmp/agent122-ci-check -maxdepth 1 -type f -exec cp '{}' /tmp/agent122-ci-evidence/ ';'
          fi
          git rev-parse HEAD > /tmp/agent122-ci-evidence/published-source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent122-countermodel-kernel-evidence
          path: /tmp/agent122-ci-evidence/
          retention-days: 14
          if-no-files-found: error
