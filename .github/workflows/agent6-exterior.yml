name: Agent6 exterior certificates

on:
  push:
    paths:
      - '.github/workflows/agent6-exterior.yml'
      - 'proofs/contributions/agent6-complementary-bulk/*.lean'
      - 'proofs/contributions/agent6-complementary-bulk/*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent6-exterior-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: proofs/contributions/agent6-complementary-bulk
      - name: Obtain checksum-pinned official Lean
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum -c -
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fresh kernel compilation and all theorem axiom audits
        run: |
          set -euo pipefail
          echo "Source commit: $GITHUB_SHA"
          python3 proofs/contributions/agent6-complementary-bulk/check.py \
            --lean lean --output-dir agent6-audit/lean
      - name: Exhaustive exterior ranks with independent ordinary-integer replay
        run: |
          set -euo pipefail
          mkdir -p agent6-audit/computation
          python3 proofs/contributions/agent6-complementary-bulk/exterior_certificate.py \
            --all-caps --output agent6-audit/computation/exterior-results.json
      - name: Retain exact sources and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent6-exterior-${{ github.sha }}
          path: |
            proofs/contributions/agent6-complementary-bulk/
            agent6-audit/
          retention-days: 7
          compression-level: 6
