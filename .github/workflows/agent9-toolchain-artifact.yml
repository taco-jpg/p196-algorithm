name: Agent 9 Lean checking runtime
on:
  push:
    branches: [research/agent9-complementary-bulk-20261015]
    paths: [.github/workflows/agent9-toolchain-artifact.yml]
  workflow_dispatch:
permissions: {}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain and package official Lean 4.19.0 checker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent9-runtime
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean-official.tar.zst
          sha256sum /tmp/lean-official.tar.zst | tee /tmp/agent9-runtime/official-archive.sha256
          tar --zstd -xf /tmp/lean-official.tar.zst -C /tmp/agent9-runtime
          cd /tmp/agent9-runtime/lean-4.19.0-linux
          # Preserve executables, dynamic libraries, .olean objects, and licenses.
          # Native code generation is not part of this checking-only runtime.
          find . -type f \( -name '*.a' -o -name '*.c' -o -name '*.ilean' \) -delete
          rm -rf src include share
          ./bin/lean --version | tee /tmp/agent9-runtime/version.txt
          cd /tmp/agent9-runtime
          tar --zstd -cf /tmp/lean-4.19.0-checker.tar.zst lean-4.19.0-linux official-archive.sha256 version.txt
          sha256sum /tmp/lean-4.19.0-checker.tar.zst
          ls -lh /tmp/lean-4.19.0-checker.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: agent9-lean-4.19.0-checker
          path: /tmp/lean-4.19.0-checker.tar.zst
          compression-level: 0
          retention-days: 7
