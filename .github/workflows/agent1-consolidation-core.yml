name: Agent1 reviewed consolidation core
on:
  push:
    branches: [integrate/agent-1/20261015T1901Z]
    paths: [.github/workflows/agent1-consolidation-core.yml]
permissions:
  contents: read
concurrency:
  group: agent1-consolidation-core
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin actual merged main and export missing Git objects
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=a79036909714e34a2b8b7ccccd6d00caa6a04848
          test "$(git rev-parse "$SOURCE^{tree}")" = e9a71807c6d716e5074a1a3d099c6d54b644a463
          mkdir -p /tmp/agent1-post49-source
          git update-ref refs/agent1/post49/main "$SOURCE"
          git update-ref refs/agent1/post49/workflow "$GITHUB_SHA"
          git bundle create /tmp/agent1-post49-source/post49.bundle refs/agent1/post49/main refs/agent1/post49/workflow ^4378a3eece1f7e321fc712318c096edd007c604f
          git bundle verify /tmp/agent1-post49-source/post49.bundle
          cd /tmp/agent1-post49-source
          sha256sum post49.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent1-post49-exact-source
          path: /tmp/agent1-post49-source/
          retention-days: 14
          if-no-files-found: error
      - name: Clean pinned source and official Lean runtime
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach a79036909714e34a2b8b7ccccd6d00caa6a04848
          test -z "$(git status --porcelain --untracked-files=no)"
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/agent1-core-lean.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  /tmp/agent1-core-lean.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/agent1-core-lean.tar.zst -C /tmp
      - name: Fresh combined post-merge compilation and exhaustive axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent1-post49-evidence
          set +e
          python3 -u proofs/verify_project.py --lean /tmp/lean-4.19.0-linux/bin/lean --project consolidation-core --output /tmp/agent1-post49-evidence/build > /tmp/agent1-post49-evidence/console.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > /tmp/agent1-post49-evidence/build.exit
          cat /tmp/agent1-post49-evidence/console.log
          test "$result" -eq 0
      - name: Independent finite controls and honest global-catalogue check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B proofs/contributions/agent-1/consolidation-20261015/finite_controls.py --output /tmp/agent1-post49-evidence/finite-controls.json > /tmp/agent1-post49-evidence/finite-controls.log
          set +e
          python3 -B proofs/verify_project.py --lean /tmp/lean-4.19.0-linux/bin/lean --check-only --output /tmp/agent1-post49-evidence/global-catalogue > /tmp/agent1-post49-evidence/global-catalogue.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > /tmp/agent1-post49-evidence/global-catalogue.exit
          test "$result" -eq 2
      - name: Preserve all substantive records without overwriting earlier executions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/agent1-post49-evidence');root.mkdir(exist_ok=True)
          for path in root.rglob('*.olean'):path.unlink()
          report=root/'build/verification.json'
          result=json.loads(report.read_text()) if report.exists() else {}
          record={'agent':'Agent #1','workflow_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'expected_source_commit':'a79036909714e34a2b8b7ccccd6d00caa6a04848','status':result.get('status','NO_BUILD_RESULT'),'scope':'Registered38-module core only; legacy accepted catalogue remains incomplete','repository_wide_pass':False}
          (root/'RUN.json').write_text(json.dumps(record,indent=2)+'\n')
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file() and p!=root/'PUBLISH_FILES.json'}
          (root/'PUBLISH_FILES.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent1-post49-core-evidence
          path: /tmp/agent1-post49-evidence/
          retention-days: 14
          if-no-files-found: error
