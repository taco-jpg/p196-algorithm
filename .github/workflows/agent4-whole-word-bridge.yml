name: Agent4 whole-word and numeric bridge

on:
  push:
    paths:
      - '.github/workflows/agent4-whole-word-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-numeric-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout own sources without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: proofs/agent4
          fetch-depth: 1
          persist-credentials: false
      - name: Install the exact official Lean compiler
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o lean.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Stage pinned foundation and checked own sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent4_wholeword_ci proofs/agent4/prefix_growth/integration/logs
          cp proofs/agent4/prefix_growth/PrefixModel.lean \
            proofs/agent4/prefix_growth/SaturationCertificate.lean \
            proofs/agent4/prefix_growth/SaturationTheorem.lean \
            proofs/agent4/prefix_growth/integration/WholeWordBridge.lean agent4_wholeword_ci/
          curl --fail --location --retry 3 -o agent4_wholeword_ci/LychrelDigitSums.lean \
            https://raw.githubusercontent.com/taco-jpg/p196-algorithm/c2cfb0acfdbf93c12172ebbfa2668ac9976a93bd/proofs/research/continuation/LychrelDigitSums.lean
          cd agent4_wholeword_ci
          echo 'ca5f46523b7cff02c00918b6466a97963087b499fb5f184232b8b3d806dc0b57  LychrelDigitSums.lean' | sha256sum -c -
          echo '483fc3084a9e9b796f9fd56e9640962839417386a30a2c803c9dd9b09ffa5b87  WholeWordBridge.lean' | sha256sum -c -
          { echo "Input commit: $GITHUB_SHA"; lean --version; sha256sum *.lean; } \
            > ../proofs/agent4/prefix_growth/integration/logs/source-manifest.log
      - name: Compile the unchanged foundational source from scratch
        shell: bash
        run: |
          set -euo pipefail
          cd agent4_wholeword_ci
          LEAN_PATH=. lean -j1 -o LychrelDigitSums.olean LychrelDigitSums.lean 2>&1 \
            | tee ../proofs/agent4/prefix_growth/integration/logs/Foundation.log
      - name: Recheck the finite certificate and audit the numeric bridge roots
        shell: bash
        run: |
          set -euo pipefail
          python proofs/agent4/prefix_growth/verify_lean.py \
            --lean "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" \
            --output proofs/agent4/prefix_growth/integration/logs \
            agent4_wholeword_ci/PrefixModel.lean agent4_wholeword_ci/SaturationCertificate.lean \
            agent4_wholeword_ci/SaturationTheorem.lean agent4_wholeword_ci/WholeWordBridge.lean
          cd proofs/agent4/prefix_growth
          python test_prefix_projection.py
          mv prefix-projection-controls.json integration/logs/
      - name: Publish only successful own audit records
        shell: bash
        env:
          PUBLICATION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proofs/agent4/prefix_growth/integration/logs/
          if ! git diff --cached --quiet; then
            git commit -m 'proofs(agent4): publish fresh whole-word and numeric bridge verification'
            HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUBLICATION_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=$HEADER" fetch origin main
            git rebase origin/main
            git -c "http.https://github.com/.extraheader=$HEADER" push origin HEAD:main
          fi
      - name: Retrieve pinned Agent109 sources for subsequent independent review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent109_review_inputs
          BASE=https://raw.githubusercontent.com/taco-jpg/p196-algorithm/0ace6dde2af6f7e4982e2765c599052812018a83/proofs/contributions/agent-109
          for NAME in TemplateStep Compat; do
            curl --fail --location --retry 3 -o "agent109_review_inputs/$NAME.lean" "$BASE/template-step-bridge/$NAME.lean"
          done
          for NAME in ReturnCertificate CertCompat; do
            curl --fail --location --retry 3 -o "agent109_review_inputs/$NAME.lean" "$BASE/template-return-certificate/$NAME.lean"
          done
          sha256sum agent109_review_inputs/*.lean > agent109_review_inputs/source-manifest.log
      - name: Retain exact checked bytes and unexecuted reciprocal-review inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent4-numeric-bridge-and-agent109-inputs
          path: |
            agent4_wholeword_ci/*.lean
            proofs/agent4/prefix_growth/integration/logs/
            agent109_review_inputs/
          retention-days: 7
          if-no-files-found: error
