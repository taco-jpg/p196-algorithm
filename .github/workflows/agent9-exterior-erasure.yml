name: Agent 9 exterior erasure
on:
  push:
    branches: [research/agent9-complementary-bulk-20261015]
    paths:
      - proofs/contributions/2026-10-15-agent9-complementary-bulk/**
      - .github/workflows/agent9-exterior-erasure.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Compile source and inspect axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          cd proofs/contributions/2026-10-15-agent9-complementary-bulk
          lean ExteriorErasure.lean 2>&1 | tee ExteriorErasure.compiler.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool' ExteriorErasure.compiler.log; then
            echo 'Rejected: admitted proof or native reduction axiom found.'
            exit 1
          fi
          if grep -En '(^|[[:space:]])(axiom|sorry|admit|native_decide)([[:space:]]|$)' ExteriorErasure.lean; then
            echo 'Rejected: disallowed declaration or proof command.'
            exit 1
          fi
