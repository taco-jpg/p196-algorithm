# Bootstrap the ordinary official Lean release for network-isolated research.
# This workflow uses no repository or user secrets, and runs only on edits
# to this file on Agent 3's research branch. The archive expires after one day.
name: Agent 3 Lean bootstrap
on:
  push:
    branches: [research/agent3-complementary-bulk-20261015]
    paths: ['.github/workflows/agent3-lean-bootstrap.yml']
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and verify pinned official Lean release
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum --check
      - name: Transfer compiler to the research session
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent3-lean-4.19.0-linux-bootstrap
          path: lean-4.19.0-linux.tar.zst
          compression-level: 0
          retention-days: 1
