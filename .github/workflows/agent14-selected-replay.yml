name: Agent14 selected-source independent audit replay
on:
  push:
    branches: [audit/agent-14/20261015T050330-rebuild]
    paths: [.github/workflows/agent14-selected-replay.yml]
  workflow_dispatch:
concurrency:
  group: agent14-selected-audit-replay
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  replay:
    if: github.ref == 'refs/heads/audit/agent-14/20261015T050330-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout only the owned audit output branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          sparse-checkout: proofs/coordination/audits/agent-14/20261015T050330-rebuild
      - name: Checkout the exact early proof source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f49d2fa2319d34e3f97fc94e49523c3ed3e056f4
          path: early
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /proofs/contributions/agent6-complementary-bulk/ExteriorCore.lean
            /proofs/contributions/agent6-complementary-bulk/ExteriorCapTwo.lean
            /proofs/contributions/agent6-complementary-bulk/ExteriorCoverage.lean
            /proofs/agent5/ExteriorClock.lean
            /proofs/contributions/2026-10-15-agent2-complementary-search/ExteriorCharge.lean
            /proofs/contributions/2026-10-15-safe-high-return/SafeHighWitness.lean
            /proofs/contributions/2026-10-15-safe-high-return/SafeHighFamily.lean
      - name: Checkout the exact later arithmetic bridge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eb893f01c3d9f6e46007178326d7b19f92529d3e
          path: late
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /proofs/research/continuation/LychrelDigitSums.lean
            /proofs/contributions/2026-10-15-high-carry-reduction-formal/HighCarryReduction.lean
            /proofs/contributions/2026-10-15-high-return-rank-formal/HighReturnRank.lean
            /proofs/contributions/agent-105/actual-high-return/
            /proofs/contributions/agent-105/high-return-criterion/
            /proofs/contributions/2026-10-15-agent8-complementary-bulk/
            /proofs/contributions/agent-109/template-step-bridge/
      - name: Verify immutable source pins and compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C early rev-parse HEAD)" = f49d2fa2319d34e3f97fc94e49523c3ed3e056f4
          test "$(git -C late rev-parse HEAD)" = eb893f01c3d9f6e46007178326d7b19f92529d3e
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Reconstruct the exact independently retained theorem inventory
        shell: bash
        run: |
          set -euo pipefail
          scripts=audit/proofs/coordination/audits/agent-14/20261015T050330-rebuild/reproduce
          python "$scripts/prepare_manifest.py" --spec "$scripts/source_spec.json" --early-root early --late-root late --output "$RUNNER_TEMP/selected_manifest.json"
      - name: Compile all selected sources from empty objects and audit every named theorem
        shell: bash
        run: |
          set -euo pipefail
          scripts=audit/proofs/coordination/audits/agent-14/20261015T050330-rebuild/reproduce
          python "$scripts/replay_selected.py" --early-root early --late-root late --lean "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --manifest "$RUNNER_TEMP/selected_manifest.json" --output "$RUNNER_TEMP/agent14-replay" --timeout 600
      - name: Preserve successful or failed execution evidence without compiled objects
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="audit/proofs/coordination/audits/agent-14/20261015T050330-rebuild/evidence/ci-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          printf '%s\n' "$GITHUB_SHA" > "$dest/audit-source-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$dest/workflow-run.txt"
          test ! -f "$RUNNER_TEMP/selected_manifest.json" || cp "$RUNNER_TEMP/selected_manifest.json" "$dest/selected_manifest.json"
          test ! -f "$RUNNER_TEMP/agent14-replay/execution.json" || cp "$RUNNER_TEMP/agent14-replay/execution.json" "$dest/execution.json"
          test ! -d "$RUNNER_TEMP/agent14-replay/logs" || cp -a "$RUNNER_TEMP/agent14-replay/logs" "$dest/logs"
          test ! -f "$RUNNER_TEMP/agent14-replay/build/Agent14SelectedAudit.lean" || cp "$RUNNER_TEMP/agent14-replay/build/Agent14SelectedAudit.lean" "$dest/Agent14SelectedAudit.lean"
          (cd "$dest"; find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/audit-evidence-sha256.txt"
          cp "$RUNNER_TEMP/audit-evidence-sha256.txt" "$dest/SHA256SUMS"
      - name: Retain downloadable raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent14-selected-replay
          path: audit/proofs/coordination/audits/agent-14/20261015T050330-rebuild/evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Publish only this run's evidence to the owned audit branch
        if: always()
        shell: bash
        working-directory: audit
        run: |
          set -euo pipefail
          dest="proofs/coordination/audits/agent-14/20261015T050330-rebuild/evidence/ci-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "audit(agent-14): retain exact CI replay evidence for run ${GITHUB_RUN_ID}"
            git fetch origin audit/agent-14/20261015T050330-rebuild
            git rebase origin/audit/agent-14/20261015T050330-rebuild
            git push origin HEAD:refs/heads/audit/agent-14/20261015T050330-rebuild
          fi
