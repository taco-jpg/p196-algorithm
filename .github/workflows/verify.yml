name: verify
# On every push: check only what the push changed (python3 tools/verify.py --changed <previous main>).
# Every night and on demand: check the whole repository (python3 tools/verify.py).
# Built Lean modules are cached between runs, so only new or changed files are compiled.
# The cache key is unique per run: a run that times out still saves its progress (a key that
# another run already used for the same commit cannot be saved again).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore built modules
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lake-${{ hashFiles('lean/lean-toolchain') }}-
      - name: Run U44 alert-checker regression tests
        run: python3 calculation/new_structures/U44/test_alert_check.py
      - name: Verify
        timeout-minutes: 330
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 tools/verify.py --changed "$BEFORE"
          else
            python3 tools/verify.py
          fi
      - name: Save built modules (also after a failure or timeout, so progress is kept)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
