name: Agent113 descending-prefix triple-cycle Lean verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent113-triple-cycles.yml'
      - 'proofs/Agent113TripleCycles.lean'
      - 'proofs/Agent113TripleRepeat.lean'
      - 'proofs/Agent113TripleMaximality.registry.json'
      - 'proofs/LychrelDigitSums__0810ace083af80c5.lean'
      - 'proofs/TwoDigitProjection__3382df2d49aa2354.lean'
      - 'proofs/verify_project__214bf7673efe116b.py'
      - 'proofs/contributions/agent-113/descending-prefix-maximality-20261016/**'
  pull_request:
    paths:
      - '.github/workflows/agent113-triple-cycles.yml'
      - 'proofs/Agent113TripleCycles.lean'
      - 'proofs/Agent113TripleRepeat.lean'
      - 'proofs/Agent113TripleMaximality.registry.json'
      - 'proofs/LychrelDigitSums__0810ace083af80c5.lean'
      - 'proofs/TwoDigitProjection__3382df2d49aa2354.lean'
      - 'proofs/verify_project__214bf7673efe116b.py'
      - 'proofs/contributions/agent-113/descending-prefix-maximality-20261016/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent113-triple-cycles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-lean-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out the complete current source closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            proofs/Agent113TripleCycles.lean
            proofs/Agent113TripleRepeat.lean
            proofs/Agent113TripleMaximality.registry.json
            proofs/LychrelDigitSums__0810ace083af80c5.lean
            proofs/TwoDigitProjection__3382df2d49aa2354.lean
            proofs/verify_project__214bf7673efe116b.py
            proofs/contributions/agent-113/descending-prefix-maximality-20261016
          sparse-checkout-cone-mode: false
      - name: Install and authenticate official Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent113-runtime"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum -c -
          tar --zstd --no-same-owner -xf lean-4.19.0-linux.tar.zst
          "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --version \
            > "$RUNNER_TEMP/agent113-runtime/lean-version.log"
          sha256sum lean-4.19.0-linux.tar.zst lean-4.19.0-linux/bin/lean \
            > "$RUNNER_TEMP/agent113-runtime/distribution.sha256"
      - name: Replay finite evidence, strict closure, full audit and public consumer
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          python3 proofs/contributions/agent-113/descending-prefix-maximality-20261016/verify.py \
            --lean "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" \
            --output "$RUNNER_TEMP/agent113-audit"
      - name: Retain complete source, compiler, audit and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent113-triple-cycle-lean-audit
          path: |
            ${{ runner.temp }}/agent113-runtime/
            ${{ runner.temp }}/agent113-audit/
            !${{ runner.temp }}/agent113-audit/**/*.olean
            !${{ runner.temp }}/agent113-audit/**/*.ilean
            !${{ runner.temp }}/agent113-audit/**/__pycache__/
          retention-days: 14
          if-no-files-found: warn
