name: Carry observability proof check

on:
  push:
    branches: [research/carry-observability-20261015]
    paths:
      - 'proofs/contributions/2026-10-15-carry-observability/*.lean'
      - '.github/workflows/carry-observability.yml'

permissions:
  contents: read

jobs:
  lean-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public source commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set '/proofs/contributions/2026-10-15-carry-observability/'
          git fetch --filter=blob:none --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install fixed official Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 \
            'https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst' \
            --output /tmp/lean.tar.zst
          sha256sum /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.19.0-linux/bin' >> "$GITHUB_PATH"
      - name: Kernel check and print dependencies
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          cd proofs/contributions/2026-10-15-carry-observability
          sha256sum *.lean
          for source in *.lean; do
            echo "CHECKING ${source}"
            lean "$source"
          done
