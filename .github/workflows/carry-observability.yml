name: Carry observability source snapshot

on:
  push:
    branches: [research/carry-observability-20261015]
    paths:
      - '.github/workflows/carry-observability.yml'

permissions:
  contents: read

concurrency:
  group: carry-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set '/proofs/**/*.lean'
          git fetch --filter=blob:none --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Package pinned formal sources and manifest
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_COMMIT.txt
          find proofs -type f -name '*.lean' -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256.txt
          find proofs -type f -name '*.lean' -print0 > source-files.txt0
          tar --null -T source-files.txt0 -czf formal-sources.tar.gz
          sha256sum formal-sources.tar.gz
          wc -l SOURCE_SHA256.txt
      - name: Export sources for local kernel verification
        uses: actions/upload-artifact@v4
        with:
          name: agent10-pinned-formal-sources
          path: |
            formal-sources.tar.gz
            SOURCE_COMMIT.txt
            SOURCE_SHA256.txt
          retention-days: 1
          compression-level: 0
