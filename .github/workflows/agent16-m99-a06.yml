name: Agent16 M99-A06 bridge

on:
  push:
    paths:
      - 'proofs/contributions/agent-16/m99-a06/**'
      - '.github/workflows/agent16-m99-a06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Install checksum-pinned Lean 4.19.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o lean.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Compile M99-A06 source
        run: |
          set -euo pipefail
          cd proofs
          lean contributions/agent-16/m99-a06/M99A06.lean 2>&1 | tee ../m99-a06-lean.log
      - name: Preserve log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent16-m99-a06-${{ github.sha }}
          path: m99-a06-lean.log
          retention-days: 7
