name: Agent7 outer-boundary verification
on:
  push:
    branches: ['agent7/outer-boundary-audit']
    paths: ['proofs/agent7/**', '.github/workflows/agent7-outer-verification.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public source commit
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin https://github.com/taco-jpg/p196-algorithm.git
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o lean.tar.zst
          sha256sum lean.tar.zst
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Compile exact Lean sources and show transitive axioms
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          cd source/proofs/agent7
          for f in *.lean; do
            echo "=== SOURCE $f ==="
            sha256sum "$f"
            lean "$f"
          done
      - name: Run independent Python audit when present
        shell: bash
        run: |
          set -euo pipefail
          cd source/proofs/agent7
          if test -f test_bulk_quotient.py; then
            python3 -m unittest -v test_bulk_quotient.py
          fi
