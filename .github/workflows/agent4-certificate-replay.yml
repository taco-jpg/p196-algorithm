name: Agent4 historical byte-exact certificate replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout isolated research paths
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5
          sparse-checkout: proofs/agent4
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable historical input identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5
          test "$(git rev-parse HEAD:proofs/agent4)" = 6d59c68f8f5922f85f5238081ce46226af0e1c02
          printf '{"workflow_source":"%s","historical_source":"%s","input_tree":"%s","scope":"Historical replay; not final-main acceptance"}\n' "$GITHUB_SHA" "$(git rev-parse HEAD)" "$(git rev-parse HEAD:proofs/agent4)" > proofs/agent4/WORKFLOW_SOURCE.json
      - name: Separate retained historical outputs from this execution
        shell: bash
        run: |
          set -euo pipefail
          for dir in proofs/agent4/complementary_bulk/logs proofs/agent4/complementary_bulk/results proofs/agent4/prefix_growth/logs proofs/agent4/prefix_growth/integration/logs; do
            if test -d "$dir"; then
              mkdir -p "$RUNNER_TEMP/agent4-historical-outputs/$(dirname "$dir")"
              mv "$dir" "$RUNNER_TEMP/agent4-historical-outputs/$dir"
            fi
            mkdir -p "$dir"
          done
          summary=proofs/agent4/prefix_growth/saturation-summary.json
          if test -f "$summary"; then
            mkdir -p "$RUNNER_TEMP/agent4-historical-outputs/$(dirname "$summary")"
            mv "$summary" "$RUNNER_TEMP/agent4-historical-outputs/$summary"
          fi

      - name: Regenerate exact certificate and independently replay it
        shell: bash
        run: |
          set -euo pipefail
          cd proofs/agent4/complementary_bulk
          mkdir -p logs
          echo "Historical input commit: $(git rev-parse HEAD); workflow commit: $GITHUB_SHA" > logs/certificate-ci.log
          python --version >> logs/certificate-ci.log
          sha256sum quotient.py search.py replay.py test_quotient.py >> logs/certificate-ci.log
          python -m unittest -v test_quotient 2>&1 | tee -a logs/certificate-ci.log
          python search.py --cap 6 2>&1 | tee -a logs/certificate-ci.log
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          summary=json.loads(Path('results/cap6-summary.json').read_text())
          assert summary['vertices']==637632
          assert summary['edges']==15260 and summary['exits']==622372
          assert summary['cycles']==[] and summary['max_exit_transitions']==5
          assert summary['edge_stream_sha256']=='edd32c9bac703996e0817b6bc7118e1a88b92e573b982794bd756dd86d710833'
          assert summary['rank_json_sha256']=='bc0edd6916638340bac7115e99313485176c5b9e0ed242195b2528f8f54198ee'
          p=Path('results/cap6-ranks.json.gz')
          Path(str(p)+'.b64').write_text(base64.encodebytes(p.read_bytes()).decode())
          p.unlink()  # Force independent replay to test the published text encoding.
          PY
          python replay.py --cap 6 2>&1 | tee -a logs/certificate-ci.log
      - name: Hand replay evidence to the canonical writer
        shell: bash
        run: |
          set -euo pipefail
          printf 'Historical inputs: 2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5. Replay outputs are retained in this run artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'The canonical writer reviews and preserves this evidence before any repository publication. This workflow performs no Git ref mutation.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact checked research snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent4-checked-research-snapshot
          path: |
            ${{ runner.temp }}/agent4-historical-outputs/
            proofs/agent4/WORKFLOW_SOURCE.json
            proofs/agent4/complementary_bulk/
          retention-days: 7
          if-no-files-found: error
