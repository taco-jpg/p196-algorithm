name: Agent14 pinned audit-source snapshot
on:
  push:
    branches: [audit/agent-14/20261015T050330-rebuild]
    paths: [.github/workflows/agent14-audit-source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eb893f01c3d9f6e46007178326d7b19f92529d3e
          persist-credentials: false
          sparse-checkout: |
            proofs/contributions/agent-105
            proofs/contributions/agent-109
            proofs/contributions/2026-10-15-high-carry-reduction-formal
            proofs/contributions/2026-10-15-high-return-rank-formal
            proofs/contributions/2026-10-15-agent8-complementary-bulk
            proofs/research/continuation
      - name: Retain exact selected source and provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = eb893f01c3d9f6e46007178326d7b19f92529d3e
          git rev-parse HEAD > audit-source-commit.txt
          paths=(proofs/contributions/agent-105 proofs/contributions/agent-109 proofs/contributions/2026-10-15-high-carry-reduction-formal proofs/contributions/2026-10-15-high-return-rank-formal proofs/contributions/2026-10-15-agent8-complementary-bulk proofs/research/continuation/LychrelDigitSums.lean)
          git ls-tree -r --full-tree HEAD -- "${paths[@]}" > audit-source-git-tree.txt
          find "${paths[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > audit-source-sha256.txt
          tar --zstd -cf /tmp/agent14-audit-sources-eb893f0.tar.zst "${paths[@]}" audit-source-commit.txt audit-source-git-tree.txt audit-source-sha256.txt
          sha256sum /tmp/agent14-audit-sources-eb893f0.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent14-audit-sources-eb893f0
          path: /tmp/agent14-audit-sources-eb893f0.tar.zst
          retention-days: 7
          if-no-files-found: error
