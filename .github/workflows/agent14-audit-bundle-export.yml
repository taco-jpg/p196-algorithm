name: Agent14 published audit bundle export
on:
  push:
    branches: [audit/agent-14/20261015T050330-rebuild]
    paths: [.github/workflows/agent14-audit-bundle-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: afbf1496028c6ae29871aff77fd72fbd157758fa
          persist-credentials: false
          sparse-checkout: proofs/coordination/audits/agent-14/20261015T050330-rebuild
      - name: Export immutable report and evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = afbf1496028c6ae29871aff77fd72fbd157758fa
          path=proofs/coordination/audits/agent-14/20261015T050330-rebuild
          git rev-parse HEAD > published-audit-commit.txt
          git ls-tree -r HEAD -- "$path" > published-audit-git-tree.txt
          find "$path" -type f -print0 | sort -z | xargs -0 sha256sum > published-audit-sha256.txt
          tar --zstd -cf /tmp/agent14-published-audit.tar.zst "$path" published-audit-commit.txt published-audit-git-tree.txt published-audit-sha256.txt
          sha256sum /tmp/agent14-published-audit.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent14-published-audit-afbf149
          path: /tmp/agent14-published-audit.tar.zst
          retention-days: 7
          if-no-files-found: error
