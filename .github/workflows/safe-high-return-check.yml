name: Safe high-return witness check
on:
  push:
    branches: [research/high-return-safety-20261015]
    paths:
      - proofs/contributions/2026-10-15-safe-high-return/**
      - .github/workflows/safe-high-return-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: proofs/contributions/2026-10-15-safe-high-return
      - name: Exact independent Python controls
        run: python3 proofs/contributions/2026-10-15-safe-high-return/verify_witness.py
      - name: Install pinned official Lean release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Kernel check and print axioms
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          cd proofs/contributions/2026-10-15-safe-high-return
          lean -j1 -o SafeHighWitness.olean SafeHighWitness.lean
          LEAN_PATH=. lean -j1 -o SafeHighFamily.olean SafeHighFamily.lean
          LEAN_PATH=. lean -j1 FamilyAudit.lean
