name: Agent108 modular-autonomy kernel verification

on:
  push:
    branches: ['research/agent-108/**']
    paths:
      - 'proofs/contributions/agent-108/modular-autonomy/**'
      - '.github/workflows/agent108-modular-autonomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact proof source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            proofs/contributions/agent-108/modular-autonomy
            proofs/research/Lychrel196Research.lean
            proofs/research/lean-toolchain
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Obtain and authenticate the pinned official Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum -c -
          tar --zstd -xf lean-4.19.0-linux.tar.zst
      - name: Fresh full-source build and every transitive axiom audit
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          python3 proofs/contributions/agent-108/modular-autonomy/verify.py \
            "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" \
            --build-root "$RUNNER_TEMP/agent108-fresh-build" --phase github-official
      - name: Retain exact logs and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent108-modular-autonomy-audit
          path: proofs/contributions/agent-108/modular-autonomy/review/clean/
          retention-days: 7
          if-no-files-found: error
