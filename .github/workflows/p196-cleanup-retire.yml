name: P196 retirement status (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p196-retirement-status
  cancel-in-progress: false
jobs:
  inspect-current-refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect the complete current branch set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p196-retirement-status"
          git ls-remote --heads origin > "$RUNNER_TEMP/p196-retirement-status/heads.txt"
          git ls-remote --symref origin HEAD > "$RUNNER_TEMP/p196-retirement-status/default.txt"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p196-retirement-status'
          heads = {ref: sha for sha, ref in (line.split() for line in (root / 'heads.txt').read_text().splitlines())}
          report = {
              'mode': 'READ_ONLY', 'workflow_source': os.environ['GITHUB_SHA'],
              'heads': heads, 'head_count': len(heads),
              'one_branch_ref_criterion': set(heads) == {'refs/heads/main'},
              'campaign_acceptance': 'NOT_EVALUATED', 'retirement_executed': False,
              'reason': 'The preserved 668beb73f0a69c7ad8d8 transport belongs to an older migration. Current retirement requires the canonical writer and all r2 preservation, content, review, producer, PR, ancestry, and mutation-time tip gates.'
          }
          (root / 'status.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Read-only retirement status\n\n')
              out.write(f"Observed {len(heads)} branch heads. No branch or tag mutation was executed.\n\n")
              out.write('The branch-count observation does not certify campaign acceptance. See issue #61 and the current canonical-writer record for the reviewed cutover.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p196-retirement-status-${{ github.run_id }}
          path: ${{ runner.temp }}/p196-retirement-status/
          retention-days: 30
          if-no-files-found: error
