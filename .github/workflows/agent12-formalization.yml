name: Agent 12 formalization and source census

on:
  push:
    branches: ['formalize/agent-12/**']
    paths:
      - '.github/workflows/agent12-formalization.yml'
      - 'proofs/contributions/agent-12/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent12-formalization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact contribution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read current shared task claims separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: p196/coordination
          path: coordination-snapshot
          sparse-checkout: proofs/coordination
          persist-credentials: false
      - name: Obtain the existing pinned Lean compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent12-audit"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum --check
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --version | tee "$RUNNER_TEMP/agent12-audit/lean-version.log"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Repeat the already locally reproduced baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '9c5f4a6a224c13a6f392ba2ccff7aab6dad10969efc5c1269037871823506ac6  proofs/agent4/complementary_bulk/CycleConstraints.lean' | sha256sum --check
          lean proofs/agent4/complementary_bulk/CycleConstraints.lean 2>&1 | tee "$RUNNER_TEMP/agent12-audit/baseline.log"
      - name: Verify Agent 12 accepted modules when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f proofs/contributions/agent-12/verify.py ]; then
            python3 proofs/contributions/agent-12/verify.py --log-dir "$RUNNER_TEMP/agent12-audit"
          else
            echo 'ENVIRONMENT CHECKPOINT ONLY: no Agent 12 mathematical completion claimed.' | tee "$RUNNER_TEMP/agent12-audit/bootstrap.log"
          fi
      - name: Preserve exact text corpus, archive listings and task snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile, zipfile
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'agent12-audit'
          out.mkdir(exist_ok=True)
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          extensions = {'.lean','.md','.txt','.json','.tsv','.csv','.toml','.yaml','.yml','.py','.sh','.tex','.bib','.cpp','.c','.h','.hpp','.rs','.html','.js','.css'}
          manifest, archives = [], []
          with tarfile.open(out / 'source-corpus.tar.gz', 'w:gz') as tar:
              for name in filter(None, names):
                  p = root / name
                  if not p.is_file() or p.is_symlink():
                      manifest.append({'path':name, 'included':False, 'reason':'not a regular file'})
                      continue
                  size = p.stat().st_size
                  included = (p.suffix in extensions or p.name in {'lean-toolchain','lakefile.lean','AGENTS.md'}) and size <= 16777216
                  row = {'path':name, 'bytes':size, 'included':included}
                  if included:
                      row['sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
                      tar.add(p, arcname='repository/' + name, recursive=False)
                  else:
                      row['reason'] = 'non-text artifact or file above 16 MiB; not substantively searched'
                  manifest.append(row)
                  if p.suffix == '.zip':
                      try:
                          with zipfile.ZipFile(p) as z:
                              archives.append({'path':name,'members':[{'path':i.filename,'bytes':i.file_size} for i in z.infolist()]})
                      except (OSError, zipfile.BadZipFile) as e:
                          archives.append({'path':name,'error':str(e)})
              coord = root / 'coordination-snapshot'
              for p in sorted((coord / 'proofs/coordination').rglob('*')):
                  if p.is_file() and not p.is_symlink():
                      tar.add(p, arcname='coordination/' + str(p.relative_to(coord)), recursive=False)
          data = {'agent':12, 'source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'coordination_head':subprocess.check_output(['git','-C','coordination-snapshot','rev-parse','HEAD'],text=True).strip(),
                  'files':manifest, 'archive_listings':archives,
                  'coverage_note':'Manifest and archive member listing are discovery aids, not semantic claim coverage.'}
          (out / 'corpus-manifest.json').write_text(json.dumps(data, indent=2) + '\n')
          (out / 'source-tree.txt').write_bytes(subprocess.check_output(['git','ls-tree','-r','-l','HEAD']))
          PY
      - name: Retain exact sources and complete logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent12-formalization-${{ github.sha }}
          path: ${{ runner.temp }}/agent12-audit/
          retention-days: 7
          if-no-files-found: error
