name: Agent1 English translation inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/agent1-english-inventory.yml]
permissions:
  contents: read
concurrency:
  group: agent1-english-translation-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inventory tracked text without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, pathlib, re, subprocess, tarfile, unicodedata
          root = pathlib.Path.cwd()
          out = pathlib.Path('/tmp/agent1-english-inventory')
          out.mkdir()
          raw = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', 'HEAD'])
          tree = []
          selected = []
          nontext = []
          unusual = collections.Counter()
          pattern = re.compile(r'[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uac00-\ud7af\u0400-\u052f\u0600-\u06ff]')
          for entry in raw.split(b'\x00'):
              if not entry:
                  continue
              meta, encoded_path = entry.split(b'\t', 1)
              mode, kind, sha = meta.decode('ascii').split()
              path = encoded_path.decode('utf-8')
              rec = {'path': path, 'mode': mode, 'type': kind, 'git_blob': sha}
              tree.append(rec)
              if kind != 'blob' or mode == '120000':
                  continue
              data = (root / path).read_bytes()
              rec['bytes'] = len(data)
              rec['sha256'] = hashlib.sha256(data).hexdigest()
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  nontext.append(path)
                  continue
              if '\x00' in text:
                  nontext.append(path)
                  continue
              hits = [{'line': i, 'text': line} for i, line in enumerate(text.splitlines(), 1) if pattern.search(line)]
              if hits:
                  selected.append({'path': path, 'git_blob': sha, 'sha256': rec['sha256'], 'bytes': len(data), 'matches': hits})
              for ch in set(text):
                  if ord(ch) > 127 and unicodedata.category(ch).startswith('L'):
                      unusual[ch] += 1
          (out / 'tree.json').write_text(json.dumps(tree, indent=2, ensure_ascii=False) + '\n')
          (out / 'language_inventory.json').write_text(json.dumps(selected, indent=2, ensure_ascii=False) + '\n')
          (out / 'non_ascii_letters.json').write_text(json.dumps(dict(unusual), indent=2, ensure_ascii=False) + '\n')
          (out / 'nontext.json').write_text(json.dumps(nontext, indent=2) + '\n')
          with tarfile.open(out / 'translation-sources.tar.gz', 'w:gz') as archive:
              include = {r['path'] for r in selected}
              include.update(r['path'] for r in tree if r['path'].startswith('.github/workflows/'))
              include.update(r['path'] for r in tree if r['path'] in {'proofs/SOURCE_MAP.json', 'proofs/ACCEPTED_BUILD.json', 'proofs/replay_original_layout.py', 'proofs/verify_project.py', 'proofs/verify_release.py'})
              for path in sorted(include):
                  archive.add(root / path, arcname=path, recursive=False)
          summary = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tracked_entries': len(tree), 'files_with_script_matches': len(selected), 'nontext_files': len(nontext), 'scope': 'Full tracked-tree text/script inventory; not a semantic proof audit or a complete language classifier.'}
          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          (out / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in sorted(out.iterdir()) if p.is_file()))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent1-english-translation-inventory
          path: /tmp/agent1-english-inventory/
          retention-days: 7
          if-no-files-found: error
