name: Agent112 pinned source snapshot
on:
  push:
    branches: ['research/agent-112/s20261015T1546']
    paths: ['.github/workflows/agent112-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Archive tracked source without credentials or build caches
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_COMMIT
          git archive --format=tar HEAD | gzip -1 > agent112-source.tar.gz
          sha256sum agent112-source.tar.gz > SOURCE_SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: agent112-source
          path: |
            agent112-source.tar.gz
            SOURCE_COMMIT
            SOURCE_SHA256
          retention-days: 1
