name: Agent1 extended language inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/agent1-language-extras.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect escaped text and readable compressed contents without running repository code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,io,json,lzma,pathlib,re,subprocess,tarfile,zipfile
          root=pathlib.Path.cwd(); out=pathlib.Path('/tmp/agent1-language-extras');out.mkdir()
          sources=out/'sources';sources.mkdir()
          cjk=re.compile(r'[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uac00-\ud7af\u0400-\u052f\u0600-\u06ff]')
          escaped=re.compile(r'\\u([0-9a-fA-F]{4})')
          latin=re.compile(r'[A-Za-z\u00c0-\u024f]*[\u00c0-\u024f][A-Za-z\u00c0-\u024f]*')
          limit=32*1024*1024; found=[];checked=[];limited=[];latin_words={};seen=set()
          def inspect(label,data,compressed=False):
              try:text=data.decode('utf-8')
              except UnicodeDecodeError:return
              if '\x00' in text:return
              decoded=escaped.sub(lambda m:chr(int(m.group(1),16)),text)
              if compressed or not cjk.search(text):
                  hits=[{'line':i,'text':line} for i,line in enumerate(decoded.splitlines(),1) if cjk.search(line)]
                  if hits:
                      sha=hashlib.sha256(data).hexdigest();(sources/(sha+'.txt')).write_bytes(data)
                      found.append({'source':label,'sha256':sha,'bytes':len(data),'compressed_container':compressed,'matches':hits})
              for word in set(latin.findall(decoded)):
                  latin_words.setdefault(word,[])
                  if len(latin_words[word])<5:latin_words[word].append(label)
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\x00')
          for name in paths:
              if not name or name.startswith(('proofs/english/','.github/workflows/agent1-english','.github/workflows/agent1-language')):continue
              p=root/name
              if p.is_symlink() or not p.is_file():continue
              data=p.read_bytes();sha=hashlib.sha256(data).hexdigest()
              inspect(name,data)
              if sha in seen:continue
              seen.add(sha)
              if name.endswith('.zip'):
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      for info in z.infolist():
                          if info.is_dir():continue
                          label=name+'::'+info.filename
                          if info.file_size>limit:limited.append({'source':label,'reason':'member exceeds 32 MiB text-inspection cap'});continue
                          member=z.read(info);inspect(label,member,True);checked.append(label)
              elif name.endswith(('.tar.gz','.tar.xz')):
                  with tarfile.open(fileobj=io.BytesIO(data),mode='r:*') as t:
                      for info in t:
                          if not info.isfile():continue
                          label=name+'::'+info.name
                          if info.size>limit:limited.append({'source':label,'reason':'member exceeds 32 MiB text-inspection cap'});continue
                          stream=t.extractfile(info)
                          if stream is not None:inspect(label,stream.read(limit+1),True);checked.append(label)
              elif name.endswith(('.gz','.xz')):
                  opener=gzip.open if name.endswith('.gz') else lzma.open
                  with opener(io.BytesIO(data),'rb') as stream:member=stream.read(limit+1)
                  if len(member)>limit:limited.append({'source':name,'reason':'decompressed content exceeds 32 MiB cap'});continue
                  inspect(name+'::decompressed',member,True);checked.append(name)
          (out/'extra_language_inventory.json').write_text(json.dumps(found,ensure_ascii=False,indent=2)+'\n')
          (out/'latin_word_inventory.json').write_text(json.dumps(latin_words,ensure_ascii=False,indent=2)+'\n')
          (out/'inspected_compressed_members.json').write_text(json.dumps(checked,indent=2)+'\n')
          (out/'limits.json').write_text(json.dumps(limited,indent=2)+'\n')
          summary={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'extra_source_records':len(found),'compressed_members_inspected':len(checked),'limited_entries':len(limited),'multipart_archives':'Preserved; not reconstructed by this language scan.'}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          with tarfile.open(out/'current-english-files.tar.gz','w:gz') as t:
              for name in paths:
                  if not name:continue
                  if name.startswith('proofs/english/') or name in {'AGENTS.md','README.md','proofs/README.md','proofs/STATUS.md','proofs/OPEN_PROBLEMS.md','proofs/RESULTS.md','proofs/SOURCE_MAP.json','proofs/replay_original_layout.py','calculation/README.md'}:
                      t.add(root/name,arcname=name,recursive=False)
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(out))+'\n' for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256SUMS'))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent1-extended-language-inventory
          path: /tmp/agent1-language-extras/
          retention-days: 7
          if-no-files-found: error
