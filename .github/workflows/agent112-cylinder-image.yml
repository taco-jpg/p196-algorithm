name: Agent112 decimal-adic cylinder Lean verification

on:
  push:
    branches:
      - 'research/agent-112/**'
    paths:
      - 'proofs/contributions/agent-112/tenadic-cylinder-image-20261016/**'
      - '.github/workflows/agent112-cylinder-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out fixed source and retained dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            proofs/contributions/agent-112/tenadic-cylinder-image-20261016
            proofs/archive/source-trees/2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5/proofs/research/Lychrel196Research.lean
            proofs/archive/source-trees/2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5/proofs/contributions/agent-108/modular-autonomy/AutonomyDefs.lean
            proofs/archive/source-trees/2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5/proofs/contributions/agent-108/modular-autonomy/LeadingWitness.lean
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download official Lean 4.19.0 and authenticate archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum -c -
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --version

      - name: Fixed-source clean Lean build and transitive axiom audit
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          BASE="proofs/archive/source-trees/2eb05ef47671d6b1883e54fec9f6a4f8de9ed8f5/proofs"
          OUTPUT="$RUNNER_TEMP/agent112-lean-report"
          SOURCE="$RUNNER_TEMP/agent112-lean-src"
          mkdir -p "$OUTPUT" "$SOURCE"
          cp "$BASE/research/Lychrel196Research.lean" "$SOURCE/Lychrel196Research.lean"
          cp "$BASE/contributions/agent-108/modular-autonomy/AutonomyDefs.lean" "$SOURCE/AutonomyDefs.lean"
          cp "$BASE/contributions/agent-108/modular-autonomy/LeadingWitness.lean" "$SOURCE/LeadingWitness.lean"
          cp "proofs/contributions/agent-112/tenadic-cylinder-image-20261016/CylinderImage.lean" "$SOURCE/CylinderImage.lean"
          (
            cd "$SOURCE"
            echo 'c6c1f5441c54a36f2d82b3ef78dff1ccdbc5a506  Lychrel196Research.lean'
            echo '612b161844a0effa5730d17b7d048315619578e8  AutonomyDefs.lean'
            echo 'ea7d29fb554197848986ac50ce6f85e4a3200bed  LeadingWitness.lean'
            echo 'a00e895c14c0585e1c96182d52f831b4f76d3f95  CylinderImage.lean'
          ) > "$OUTPUT/expected-git-blobs.txt"
          (
            cd "$SOURCE"
            git hash-object Lychrel196Research.lean AutonomyDefs.lean LeadingWitness.lean CylinderImage.lean
            sha256sum Lychrel196Research.lean AutonomyDefs.lean LeadingWitness.lean CylinderImage.lean
          ) > "$OUTPUT/source-hashes.txt"
          LEAN="$RUNNER_TEMP/lean-4.19.0-linux/bin/lean"
          export LEAN_PATH="$SOURCE"
          (
            cd "$SOURCE"
            for M in Lychrel196Research AutonomyDefs LeadingWitness CylinderImage; do
              echo "COMPILING $M"
              "$LEAN" --trust=0 -j1 -DElab.async=false -o "$M.olean" "$M.lean" 2>&1 | tee "$OUTPUT/$M.log"
            done
            {
              echo 'import CylinderImage'
              echo '#print axioms Agent112.CylinderImage.occurs_for_leading_digit'
              echo '#print axioms Agent112.CylinderImage.any_occurrence_has_leading_digit'
              echo '#print axioms Agent112.CylinderImage.occurs_iff_nine_residues'
              echo '#print axioms Agent112.CylinderImage.source_units_excluded'
            } > PrintAxioms.lean
            "$LEAN" --trust=0 -j1 -DElab.async=false PrintAxioms.lean 2>&1 | tee "$OUTPUT/PrintAxioms.log"
          )
          printf 'PASS: original sources checked by Lean 4.19.0 with --trust=0\n' | tee "$OUTPUT/STATUS.txt"

      - name: Retain actual source, build, and axioms logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent112-decimal-adic-lean-check
          path: ${{ runner.temp }}/agent112-lean-report/
          retention-days: 30
          if-no-files-found: warn
