name: Agent 9 pinned research snapshot
on:
  push:
    branches: [research/agent9-scalar-completion-20261015]
    paths: [.github/workflows/agent9-research-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f49d2fa2319d34e3f97fc94e49523c3ed3e056f4
          persist-credentials: false
      - name: Package source with immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > repository-commit.txt
          git ls-tree -r --full-tree HEAD -- proofs > proof-git-tree.txt
          find proofs -type f -print0 | sort -z | xargs -0 sha256sum > proof-sha256.txt
          tar --zstd -cf /tmp/agent9-proof-snapshot.tar.zst proofs repository-commit.txt proof-git-tree.txt proof-sha256.txt
          sha256sum /tmp/agent9-proof-snapshot.tar.zst
          du -sh proofs
          ls -lh /tmp/agent9-proof-snapshot.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: agent9-proof-snapshot-f49d2fa
          path: /tmp/agent9-proof-snapshot.tar.zst
          compression-level: 0
          retention-days: 7
