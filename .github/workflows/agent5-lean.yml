name: Agent5 Lean verification

on:
  push:
    paths:
      - '.github/workflows/agent5-lean.yml'
      - 'proofs/agent5/*.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent5-lean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: proofs
      - name: Obtain pinned official Lean distribution
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum -c -
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
          ./lean-4.19.0-linux/bin/lean --version
      - name: Compile Agent5 source and print embedded axiom audits
        run: |
          set -euo pipefail
          echo "Source commit: $GITHUB_SHA" | tee proofs/agent5/ci-proof-audit.log
          export LEAN_PATH="$PWD/proofs/agent5"
          count=0
          for file in proofs/agent5/*.lean; do
            [ -f "$file" ] || continue
            count=$((count+1))
            echo "VERIFYING $file" | tee -a proofs/agent5/ci-proof-audit.log
            sha256sum "$file" | tee -a proofs/agent5/ci-proof-audit.log
            if grep -nE '\b(sorry|admit|axiom|native_decide)\b' "$file"; then
              echo 'Rejected proof shortcut or custom axiom token.'
              exit 1
            fi
            lean -o "${file%.lean}.olean" "$file" 2>&1 | tee -a proofs/agent5/ci-proof-audit.log
          done
          echo "Compiled source file count: $count" | tee -a proofs/agent5/ci-proof-audit.log
      - name: Retain sources for independent offline review
        uses: actions/upload-artifact@v4
        with:
          name: research-source-snapshot-${{ github.sha }}
          path: |
            proofs/**/*.lean
            proofs/**/*.py
            proofs/**/*.md
            proofs/agent5/ci-proof-audit.log
          retention-days: 2
          compression-level: 6
      - name: Share pinned compiler for offline verification environments
        if: contains(github.event.head_commit.message, 'bootstrap')
        uses: actions/upload-artifact@v4
        with:
          name: lean-4.19.0-linux-official
          path: lean-4.19.0-linux.tar.zst
          retention-days: 1
          compression-level: 0
