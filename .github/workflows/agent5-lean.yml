name: Agent5 Lean verification

on:
  push:
    paths:
      - '.github/workflows/agent5-lean.yml'
      - 'proofs/agent5/*.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent5-lean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: proofs/agent5
      - name: Obtain pinned official Lean distribution
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output lean-4.19.0-linux.tar.zst
          sha256sum lean-4.19.0-linux.tar.zst
          tar --zstd -xf lean-4.19.0-linux.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
          ./lean-4.19.0-linux/bin/lean --version
      - name: Compile Agent5 source and print embedded axiom audits
        run: |
          set -euo pipefail
          echo "Source commit: $GITHUB_SHA"
          if [ ! -d proofs/agent5 ]; then
            echo 'BOOTSTRAP ONLY: no Agent5 Lean source exists in this commit.'
            exit 0
          fi
          count=0
          for file in proofs/agent5/*.lean; do
            [ -f "$file" ] || continue
            count=$((count+1))
            echo "VERIFYING $file"
            sha256sum "$file"
            if grep -nE '\b(sorry|admit|axiom|native_decide)\b' "$file"; then
              echo 'Rejected proof shortcut or custom axiom token.'
              exit 1
            fi
            lean -o "${file%.lean}.olean" "$file"
          done
          echo "Compiled source file count: $count"
      - name: Share pinned compiler for offline verification environments
        if: contains(github.event.head_commit.message, 'bootstrap')
        uses: actions/upload-artifact@v4
        with:
          name: lean-4.19.0-linux-official
          path: lean-4.19.0-linux.tar.zst
          retention-days: 1
          compression-level: 0
