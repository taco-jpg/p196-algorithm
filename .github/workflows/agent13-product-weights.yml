name: Agent13 folded product-weight kernel audit
on:
  push:
    branches: ['formalize/agent-13/s20261015-products']
    paths:
      - 'proofs/contributions/agent-13/folded-product-weights/**'
      - 'proofs/contributions/agent-13/folded-binary-family/**'
      - 'proofs/contributions/agent-13/real-safe-weights/check.py'
      - 'proofs/research/continuation/LychrelDigitSums.lean'
      - '.github/workflows/agent13-product-weights.yml'
  pull_request:
    paths:
      - 'proofs/contributions/agent-13/folded-product-weights/**'
      - 'proofs/contributions/agent-13/folded-binary-family/**'
      - 'proofs/contributions/agent-13/real-safe-weights/check.py'
      - 'proofs/research/continuation/LychrelDigitSums.lean'
      - '.github/workflows/agent13-product-weights.yml'
permissions:
  contents: read
concurrency:
  group: agent13-product-weights-${{ github.ref }}
  cancel-in-progress: false
jobs:
  product-kernel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact contribution sources
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set '/proofs/research/continuation/LychrelDigitSums.lean' '/proofs/contributions/agent-13/'
          git fetch --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install exact existing Lean compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          echo "$PWD/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Restore exact same-toolchain real library
        shell: bash
        run: |
          set -euo pipefail
          git init mathlib
          cd mathlib
          git remote add origin https://github.com/leanprover-community/mathlib4.git
          git fetch --filter=blob:none --depth=1 origin c44e0c8ee63ca166450922a373c7409c5d26b00b
          git checkout --detach FETCH_HEAD
          lake exe cache get Mathlib/Data/Real/Sqrt.lean Mathlib/Algebra/Order/BigOperators/Group/Finset.lean Mathlib/Algebra/BigOperators/Ring/Finset.lean Mathlib/Tactic/Linarith.lean Mathlib/Tactic/NormNum.lean Mathlib/Tactic/FieldSimp.lean
      - name: Fresh source build and all transitive axiom audits
        shell: bash
        run: |
          set -euo pipefail
          python3 source/proofs/contributions/agent-13/folded-product-weights/check.py --lean "$PWD/lean-4.19.0-linux/bin/lean" --mathlib "$PWD/mathlib" --out "$PWD/agent13-products-ci-audit"
          echo "$GITHUB_SHA" > agent13-products-ci-audit/COMMIT.txt
          tar -czf agent13-products-ci-audit/agent13-products-source.tar.gz -C source proofs/contributions/agent-13 proofs/research/continuation/LychrelDigitSums.lean
      - name: Retain sources and complete audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent13-product-weights-kernel-audit
          path: agent13-products-ci-audit
          retention-days: 14
          if-no-files-found: warn
