name: Agent10 four-smoothing boundary
on:
  push:
    branches: ['p196/coordination']
    paths:
      - 'proofs/coordination/patches/agent10-four-smoothing-boundary-20261016/*.lean'
      - 'proofs/coordination/patches/agent10-four-smoothing-boundary-20261016/check*.py'
      - '.github/workflows/agent10-smoothing-boundary.yml'
permissions:
  contents: read
jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: proofs/coordination/patches/agent10-four-smoothing-boundary-20261016
      - name: Authenticate pinned official Lean
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 --max-time 180 --output lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
      - name: Two fresh exact dependency-closure builds and axiom audits
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          src=proofs/coordination/patches/agent10-four-smoothing-boundary-20261016
          python3 -B "$src/check_bridge.py" "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" "$src" "$RUNNER_TEMP/agent10-report"
      - name: Preserve substantive verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent10-smoothing-boundary-${{ github.sha }}
          path: ${{ runner.temp }}/agent10-report/
          retention-days: 30
          if-no-files-found: warn
