name: Agent111 exact-length palindrome residues

on:
  push:
    branches: ['research/agent-111/**']
    paths:
      - 'proofs/contributions/agent-111/exact-length-residues/*.lean'
      - 'proofs/contributions/agent-111/exact-length-residues/check.py'
      - 'proofs/research/Lychrel196Research.lean'
      - '.github/workflows/agent111-exact-length-residues.yml'
  pull_request:
    paths:
      - 'proofs/contributions/agent-111/exact-length-residues/*.lean'
      - 'proofs/contributions/agent-111/exact-length-residues/check.py'
      - 'proofs/research/Lychrel196Research.lean'
      - '.github/workflows/agent111-exact-length-residues.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            proofs/contributions/agent-111/exact-length-residues
            proofs/research/Lychrel196Research.lean
            proofs/research/lean-toolchain
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Authenticate the pinned official Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output lean-4.19.0-linux.tar.zst \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean-4.19.0-linux.tar.zst' | sha256sum -c -
          tar --zstd -xf lean-4.19.0-linux.tar.zst
      - name: Rebuild All and audit every theorem dependency
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          python3 -B proofs/contributions/agent-111/exact-length-residues/check.py \
            "$RUNNER_TEMP/lean-4.19.0-linux/bin/lean" --module All \
            --build-dir "$RUNNER_TEMP/agent111-build" \
            --output-dir "$RUNNER_TEMP/agent111-report"
      - name: Retain source identities and complete logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent111-exact-length-residues-audit
          path: ${{ runner.temp }}/agent111-report/
          retention-days: 30
          if-no-files-found: error
