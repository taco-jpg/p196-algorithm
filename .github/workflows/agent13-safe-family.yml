name: Agent13 exact safe-family kernel audit
on:
  push:
    branches: ['formalize/agent-13/s20261015']
    paths:
      - 'proofs/contributions/agent-13/safe-predecessor-family/**'
      - 'proofs/research/continuation/LychrelDigitSums.lean'
      - '.github/workflows/agent13-safe-family.yml'
  pull_request:
    paths:
      - 'proofs/contributions/agent-13/safe-predecessor-family/**'
      - 'proofs/research/continuation/LychrelDigitSums.lean'
      - '.github/workflows/agent13-safe-family.yml'
permissions:
  contents: read
concurrency:
  group: agent13-safe-family-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact checked commit
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set '/proofs/research/continuation/LychrelDigitSums.lean' '/proofs/contributions/agent-13/safe-predecessor-family/'
          git fetch --filter=blob:none --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install exact existing Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
      - name: Rebuild decimal dependency and every exported proof from source
        shell: bash
        run: |
          set -euo pipefail
          python3 source/proofs/contributions/agent-13/safe-predecessor-family/check.py --lean "$PWD/lean-4.19.0-linux/bin/lean" --out "$PWD/agent13-ci-audit"
          echo "$GITHUB_SHA" > agent13-ci-audit/COMMIT.txt
      - name: Retain complete kernel audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent13-safe-family-kernel-audit
          path: agent13-ci-audit
          retention-days: 14
          if-no-files-found: warn
