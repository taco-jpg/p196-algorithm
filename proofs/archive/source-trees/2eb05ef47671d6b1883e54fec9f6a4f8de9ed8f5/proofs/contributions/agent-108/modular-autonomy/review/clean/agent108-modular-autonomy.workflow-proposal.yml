name: Agent108 modular autonomy clean verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out contribution and its source dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            proofs/research
            proofs/contributions/agent-108/modular-autonomy
          persist-credentials: false
      - name: Obtain fixed official Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            --output "$RUNNER_TEMP/lean-4.19.0-linux.tar.zst"
          sha256sum "$RUNNER_TEMP/lean-4.19.0-linux.tar.zst" > "$RUNNER_TEMP/archive-sha256.log"
          tar --zstd -xf "$RUNNER_TEMP/lean-4.19.0-linux.tar.zst" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/lean-4.19.0-linux"
          sha256sum --check <<'SHA256'
          92c3d35b5bfaa5e0fea413a775d504cf46cd95e1345df61c2274f76779e7e023  bin/lean
          2ab605c74c78f9ba4431a7b5305a4b28a9071d8a826f223eb14fe5530f78e14d  lib/lean/libleanshared.so
          44bc5837306f8e24a5db0db56d56ca3114415bd65e3b107426d3c93e21d20098  lib/lean/libleanshared_1.so
          44bc5837306f8e24a5db0db56d56ca3114415bd65e3b107426d3c93e21d20098  lib/lean/libInit_shared.so
          f14f6c9ea0d9eb2a6fe7bdad84a6610657db3d006805708c1a62ac72b676e944  lib/lean/Init.olean
          SHA256
          ./bin/lean --version
      - name: Rebuild all local dependencies and audit every exported theorem
        shell: bash
        run: |
          set -euo pipefail
          unset LD_PRELOAD
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-commit.log"
          python3 proofs/contributions/agent-108/modular-autonomy/review/clean/clean_rebuild.py \
            --repo "$GITHUB_WORKSPACE" \
            --lean-root "$RUNNER_TEMP/lean-4.19.0-linux" \
            --build-root "$RUNNER_TEMP/agent108-independent-review-build" \
            --phase github-final \
            --modules AutonomyDefs AutonomyBasic DigitPerturbation LeadingWitness Necessity ModularAutonomy CounterexampleBound
      - name: Retain complete logs, source hashes, and axiom inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent108-modular-autonomy-clean-audit
          path: |
            proofs/contributions/agent-108/modular-autonomy/review/clean/github-final-*/
            ${{ runner.temp }}/archive-sha256.log
            ${{ runner.temp }}/source-commit.log
          retention-days: 14
          if-no-files-found: error
