name: Agent1 existing accepted kernel scopes
on:
  push:
    branches: [verify/agent-1/consolidation-20261015]
    paths: [.github/workflows/agent1-existing-kernel-scopes.yml]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scope: [prefix739, cap3]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e30535d65cb55b998e9b53332277135c293db38
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fixed source tree and official toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2e30535d65cb55b998e9b53332277135c293db38
          test "$(git rev-parse HEAD^{tree})" = 95120382e7d29c9812014aebfc8d87ca954317ee
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/agent1-existing-lean.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  /tmp/agent1-existing-lean.tar.zst' | sha256sum -c -
          tar --zstd -xf /tmp/agent1-existing-lean.tar.zst -C /tmp
      - name: Run the inspected authoritative checker from fresh source
        env:
          SCOPE: ${{ matrix.scope }}
        shell: bash
        run: |
          set -euo pipefail
          LEAN=/tmp/lean-4.19.0-linux/bin/lean
          mkdir -p /tmp/agent1-existing-evidence
          case "$SCOPE" in
            prefix739)
              python3 -B proofs/contributions/agent-104/seven-column-kernel/check.py "$LEAN" --evidence /tmp/agent1-existing-evidence/check --pins proofs/contributions/agent-104/seven-column-kernel/integration/module-pins.json --module Conclusion739 --module TerminalObstruction --jobs 2 --require-committed 2>&1 | tee /tmp/agent1-existing-evidence/console.log
              ;;
            cap3)
              python3 -B proofs/contributions/agent-116/check.py "$LEAN" --evidence /tmp/agent1-existing-evidence/check --module Agent116All --jobs 2 --require-committed 2>&1 | tee /tmp/agent1-existing-evidence/console.log
              ;;
            *) echo 'Unknown reviewed scope' >&2; exit 1;;
          esac
      - name: Retain full source identities and substantive logs on success or failure
        if: always()
        env:
          SCOPE: ${{ matrix.scope }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent1-existing-evidence
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess
          out=pathlib.Path('/tmp/agent1-existing-evidence')
          record=out/'check/verification.json'
          verification=json.loads(record.read_text()) if record.exists() else {'status':'NO_CHECKER_RESULT'}
          for path in out.rglob('*.olean'):path.unlink()
          checker={'prefix739':'proofs/contributions/agent-104/seven-column-kernel/check.py','cap3':'proofs/contributions/agent-116/check.py'}[os.environ['SCOPE']]
          (out/'RUN.json').write_text(json.dumps({'agent':'Agent #1','scope':os.environ['SCOPE'],'source_commit':'2e30535d65cb55b998e9b53332277135c293db38','source_tree':'95120382e7d29c9812014aebfc8d87ca954317ee','workflow_source':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'finished_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':verification['status'],'checker_path':checker,'checker_sha256':hashlib.sha256(pathlib.Path(checker).read_bytes()).hexdigest(),'note':'Revalidation of exact pre-existing accepted scope, not a new unrestricted Lychrel theorem or complete global catalogue.'},indent=2)+'\n')
          files={str(p.relative_to(out)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file() and p.name!='FILES.json'}
          (out/'FILES.json').write_text(json.dumps(files,indent=2)+'\n')
          print('Scope',os.environ['SCOPE'],'status',verification['status'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent1-existing-${{ matrix.scope }}
          path: /tmp/agent1-existing-evidence/
          retention-days: 14
          if-no-files-found: error
