name: Agent11 pinned source census

on:
  push:
    branches: ['formalize/agent-11/s20261015-coverage']
    paths: ['.github/workflows/agent11-source-snapshot.yml']

permissions:
  contents: read

jobs:
  source-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pinned source snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 74df59c5ecb6cb30fb3c88b1d5b26fdb9526d6c4
          persist-credentials: false
      - name: Preserve source corpus and exact exclusions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent11-source"
          git rev-parse HEAD > "$RUNNER_TEMP/agent11-source/source-commit.txt"
          git ls-tree -r --long HEAD > "$RUNNER_TEMP/agent11-source/main-tree.txt"
          git ls-remote --heads origin > "$RUNNER_TEMP/agent11-source/remote-heads.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'agent11-source'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          manifest = []
          with tarfile.open(out / 'main-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  if not name:
                      continue
                  p = pathlib.Path(name)
                  if not p.is_file():
                      continue
                  size = p.stat().st_size
                  reason = None
                  if not (name.startswith('proofs/') or name.startswith('.github/') or name in ('README.md', 'AGENTS.md')):
                      reason = 'outside initial proof-source corpus'
                  elif size > 8 * 1024 * 1024:
                      reason = 'large file: retained remotely, requires selective retrieval'
                  elif any(name.endswith(ext) for ext in ('.zip', '.gz', '.xz', '.zst', '.7z', '.bz2', '.pdf', '.png', '.jpg', '.olean', '.a', '.so')):
                      reason = 'archive, rendering, or compiled artifact: retained remotely, contents not yet inspected'
                  record = {'path': name, 'size': size, 'included': reason is None, 'exclusion': reason}
                  if reason is None:
                      record['sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
                      archive.add(p, arcname=name, recursive=False)
                  manifest.append(record)
          (out / 'corpus-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Included', sum(r['included'] for r in manifest), 'files; excluded', sum(not r['included'] for r in manifest))
          PY
          git fetch --depth=1 origin refs/heads/p196/coordination:refs/remotes/origin/p196/coordination
          git rev-parse refs/remotes/origin/p196/coordination > "$RUNNER_TEMP/agent11-source/coordination-commit.txt"
          git archive refs/remotes/origin/p196/coordination proofs/coordination | gzip > "$RUNNER_TEMP/agent11-source/coordination-source.tar.gz"
          cd "$RUNNER_TEMP/agent11-source"
          sha256sum *.tar.gz *.json *.txt > SHA256SUMS
      - name: Retain source and provenance for the active formalization session
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent11-pinned-source-census
          path: ${{ runner.temp }}/agent11-source/
          retention-days: 7
          if-no-files-found: error
