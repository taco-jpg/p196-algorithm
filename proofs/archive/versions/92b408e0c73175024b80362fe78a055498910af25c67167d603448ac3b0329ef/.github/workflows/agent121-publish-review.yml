name: Agent121 review publication and pinned Lean replay
on:
  push:
    branches: [research/agent-121/s20261015T1644-review-publication]
    paths:
      - .github/workflows/agent121-publish-review.yml
      - proofs/contributions/agent-121/publication/transport/**
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Restore and verify the exact original evidence
        id: restore
        run: python proofs/contributions/agent-121/publication/transport/restore.py
      - name: Obtain the pinned official Lean checker
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean419.tar.zst
          sha256sum /tmp/lean419.tar.zst | tee /tmp/agent121-publication-runtime.sha256
          mkdir /tmp/agent121-lean
          tar --zstd -xf /tmp/lean419.tar.zst -C /tmp/agent121-lean
          /tmp/agent121-lean/lean-4.19.0-linux/bin/lean --version | tee /tmp/agent121-publication-version.log
          echo '92c3d35b5bfaa5e0fea413a775d504cf46cd95e1345df61c2274f76779e7e023  /tmp/agent121-lean/lean-4.19.0-linux/bin/lean' | sha256sum -c - | tee /tmp/agent121-publication-checker-identity.log
      - name: Fresh finite-template proof and axiom replay
        id: template
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python proofs/contributions/agent-121/merged-template-safety-review/rebuild.py --repo "$GITHUB_WORKSPACE" --lean /tmp/agent121-lean/lean-4.19.0-linux/bin/lean --output /tmp/agent121-replay-template 2>&1 | tee /tmp/agent121-publication-template-driver.log
          python proofs/contributions/agent-121/merged-template-safety-review/audit_environment.py --run /tmp/agent121-replay-template --lean /tmp/agent121-lean/lean-4.19.0-linux/bin/lean 2>&1 | tee /tmp/agent121-publication-template-environment.log
      - name: Fresh Agent116 checkpoint proof and axiom replay
        id: checkpoint
        if: steps.toolchain.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python proofs/contributions/agent-121/review-agent116-checkpoint01/rebuild_checkpoint.py --repo "$GITHUB_WORKSPACE" --lean /tmp/agent121-lean/lean-4.19.0-linux/bin/lean --output /tmp/agent121-replay-checkpoint 2>&1 | tee /tmp/agent121-publication-checkpoint-driver.log
      - name: Preserve all evidence and publish only the owned branch
        id: publication
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python proofs/contributions/agent-121/publication/finalize_publication.py
          remote=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- proofs/contributions/agent-121 .github/workflows/agent121-publish-review.yml
          git commit -m 'review(agent-121): preserve all evidence and replay pinned Lean audits'
          git push origin HEAD:"refs/heads/${GITHUB_REF_NAME}"
      - name: Require every verification and publication gate
        if: always()
        shell: bash
        env:
          RESTORE_RESULT: ${{ steps.restore.outcome }}
          TOOLCHAIN_RESULT: ${{ steps.toolchain.outcome }}
          TEMPLATE_RESULT: ${{ steps.template.outcome }}
          CHECKPOINT_RESULT: ${{ steps.checkpoint.outcome }}
          PUBLICATION_RESULT: ${{ steps.publication.outcome }}
        run: |
          set -euo pipefail
          test "$RESTORE_RESULT" = success
          test "$TOOLCHAIN_RESULT" = success
          test "$TEMPLATE_RESULT" = success
          test "$CHECKPOINT_RESULT" = success
          test "$PUBLICATION_RESULT" = success
