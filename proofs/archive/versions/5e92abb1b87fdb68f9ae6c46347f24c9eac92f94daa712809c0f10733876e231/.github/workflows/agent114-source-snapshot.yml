name: Agent114 pinned research source snapshot
on:
  push:
    branches: [research/agent-114/s20261015T1535]
    paths: [.github/workflows/agent114-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eec3d5f3646cab50abad6e610ea19626cd249070
          persist-credentials: false
      - name: Package exact tracked text sources and current task records
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = eec3d5f3646cab50abad6e610ea19626cd249070
          git ls-tree -r HEAD > /tmp/main-git-tree.txt
          git log -10 --format=fuller > /tmp/main-recent-commits.txt
          git ls-remote --heads origin > /tmp/remote-heads.txt
          git fetch --depth=1 origin p196/coordination
          git rev-parse FETCH_HEAD > /tmp/coordination-commit.txt
          git archive FETCH_HEAD proofs/coordination > /tmp/coordination.tar
          python3 - <<'PY'
          import subprocess, pathlib, tarfile, hashlib, json
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          suffixes = {'.lean','.py','.md','.txt','.json','.yml','.yaml','.toml','.sh','.cpp','.h','.tex','.tsv'}
          records = []
          with tarfile.open('/tmp/agent114-source-snapshot.tar.gz', 'w:gz') as out:
              for p in paths:
                  if not p or not pathlib.Path(p).is_file():
                      continue
                  if pathlib.Path(p).suffix not in suffixes and pathlib.Path(p).name not in ('lean-toolchain','AGENTS.md'):
                      continue
                  out.add(p, arcname=p, recursive=False)
                  b = pathlib.Path(p).read_bytes()
                  records.append({'path':p,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              for name in ['main-git-tree.txt','main-recent-commits.txt','remote-heads.txt','coordination-commit.txt','coordination.tar']:
                  out.add('/tmp/'+name, arcname='_snapshot/'+name)
          pathlib.Path('/tmp/agent114-snapshot-manifest.json').write_text(json.dumps(records, indent=2)+'\n')
          print('retained files', len(records), 'source bytes', sum(r['bytes'] for r in records))
          PY
          sha256sum /tmp/agent114-source-snapshot.tar.gz /tmp/agent114-snapshot-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent114-source-snapshot-eec3d5f
          path: |
            /tmp/agent114-source-snapshot.tar.gz
            /tmp/agent114-snapshot-manifest.json
          retention-days: 7
          if-no-files-found: error
