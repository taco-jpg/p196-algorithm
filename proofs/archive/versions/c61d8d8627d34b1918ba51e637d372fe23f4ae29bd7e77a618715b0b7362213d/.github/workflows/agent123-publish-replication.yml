name: Agent123 exact replication publication
on:
  push:
    branches: [research/agent-123/s20261015T164520Z-publication]
    paths:
      - .github/workflows/agent123-publish-replication.yml
      - .github/agent123-publication/**
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'taco-jpg/p196-algorithm' && github.ref == 'refs/heads/research/agent-123/s20261015T164520Z-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Restore original files and replay exact raw archives
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin eec3d5f3646cab50abad6e610ea19626cd249070
          source_root=$(mktemp -d)
          source_path=proofs/contributions/agent-109/template-return-certificate/certificate_tool.py
          mkdir -p "$source_root/$(dirname "$source_path")"
          git show "eec3d5f3646cab50abad6e610ea19626cd249070:$source_path" > "$source_root/$source_path"
          python .github/agent123-publication/restore.py --repo-root "$PWD" --source-root "$source_root"
      - name: Verify staged blobs and publish isolated contribution
        shell: bash
        run: |
          set -euo pipefail
          prefix=proofs/contributions/agent-123/template-certificate-replication
          git config core.autocrlf false
          git config user.name 'Agent #123'
          git config user.email 'agent-123@research.invalid'
          git add -- "$prefix"
          python - <<'PY'
          import json, pathlib, subprocess
          prefix='proofs/contributions/agent-123/template-certificate-replication/'
          report=json.loads(pathlib.Path(prefix+'publication/byte-verification.json').read_text())
          assert report['status']=='PASS' and report['original_file_count']==66
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert names and all(p.startswith(prefix) for p in names)
          for record in report['original_files']:
              got=subprocess.check_output(['git','rev-parse',':'+prefix+record['path']],text=True).strip()
              assert got==record['git_blob'],(record['path'],got)
          print('PASS: all 66 staged Git blobs match the original evidence')
          PY
          git commit -m 'review(agent-123): publish exact retained template-certificate replication evidence'
          git push origin HEAD:refs/heads/research/agent-123/s20261015T164520Z-publication
          git rev-parse HEAD
