name: Agent121 carry-history verification
on:
  push:
    branches: ['research/agent-121/20261015-carry-window']
    paths:
      - '.github/workflows/agent121-carry-history.yml'
      - 'proofs/contributions/agent-121/carry-history-window/**'
permissions:
  contents: read
concurrency:
  group: agent121-carry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: proofs
      - name: Exact finite exploration, not a proof
        run: |
          mkdir -p agent121-evidence
          python proofs/contributions/agent-121/carry-history-window/explore.py --out agent121-evidence/exploration.json | tee agent121-evidence/exploration.log
      - name: Obtain pinned official Lean
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o lean.tar.zst
          echo '6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  lean.tar.zst' | sha256sum -c -
          tar --zstd -xf lean.tar.zst
          ./lean-4.19.0-linux/bin/lean --version
      - name: Clean scoped Lean build and axiom reports
        run: |
          set -euo pipefail
          python proofs/contributions/agent-121/carry-history-window/check.py --lean "$PWD/lean-4.19.0-linux/bin/lean" --out agent121-evidence/build | tee agent121-evidence/build.log
      - name: Retain all execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent121-carry-${{ github.sha }}
          path: |
            agent121-evidence/
            proofs/contributions/agent-121/carry-history-window/
          retention-days: 7
